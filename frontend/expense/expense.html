
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense Tracker</title>

    <style>
        .premium-container {
            text-align: right;
        }
    </style>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
</head>
<body>
    <div class="premium-container">
        <p id="premium-message"></p>

        <button type="button" id="buy-premium">
            Buy Premium Membership
        </button>

        <button type="button" id="leaderboard-button" hidden>
            Show Leaderboard
        </button>
    </div>

    <h1>Daily Expense Tracker</h1>

    <form id="expense-form">
        <label for="expenseamount">Choose expense amount:</label>
        <input
            type="number"
            id="expenseamount"
            name="expenseamount"
            min="1"
            step="0.01"
            required
        >
        <br><br>

        <label for="description">Choose description:</label>
        <input
            type="text"
            id="description"
            name="description"
            required
        >
        <br><br>

        <button type="submit">Add Expense</button>
    </form>

    <p id="message"></p>

    <h2>Your Expenses</h2>
    <ul id="expense-list"></ul>

    <div id="leaderboard-container" hidden>
        <h2>Leaderboard</h2>
        <ul id="leaderboard-list"></ul>
    </div>

    <script src="./expense.js"></script>
</body>
</html>
